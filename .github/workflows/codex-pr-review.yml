name: Codex PR Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  codex-pr-review:
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, 'codex recheck'))
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: readwiseio/codex-pr-review-action/.github/workflows/codex-pr-review.yml@master
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
